<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Bible Capstone Project</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            background: var(--primary-color);
            color: white;
            margin-bottom: 30px;
            border-radius: 8px;
            position: relative;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .intro-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            line-height: 1.8;
        }

        /* Essential for floating images: keeps the container from collapsing */
        .intro-section::after {
            content: "";
            display: table;
            clear: both;
        }

        /* Indentation for paragraphs */
        .intro-section p {
            text-indent: 40px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Image Styling: 50% width, 475px height, with wrapping */
        .featured-image {
            width: 100%;
            height: 950px;
            object-fit: cover;
            border-radius: 8px;
            float: left;
            margin-right: 25px;
            margin-bottom: 10px;
            display: inline;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 5px solid var(--accent-color);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .links-list {
            list-style: none;
            padding: 0;
        }

        .links-list li {
            margin-bottom: 10px;
        }

        .links-list a {
            text-decoration: none;
            color: #34495e;
            font-weight: 500;
            transition: color 0.2s;
        }

        .links-list a:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<header>
    <a href="https://astrofizzz.github.io/BibleCapstone/" class="back-link">← Return to Homepage</a>
    <h1>Coming Soon</h1>
    <p>Page not done yet</p>
</header>

<div class="container">

    <section class="intro-section">
        <img src="https://media.istockphoto.com/id/1495430612/vector/coming-soon-with-colorful-cut-out-foil-ribbon-confetti-background.jpg?s=612x612&w=0&k=20&c=0HjZUHqlNnUedZmJCbMpooiY92f4tgGCh_jZK51zSmU=" 
             alt="Creation Imagery" 
             class="featured-image">
    </section>

    <div class="grid-container">
        <div class="category-card">
            <h2>COMING SOON</h2>
            <ul class="links-list">
                <li>UNDER CONSTRUCTION</li>
            </ul>
        </div>
    </div>

</div>

</body>
</html>
